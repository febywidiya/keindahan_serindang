<section class="aduan-section">

    <div class="container">

        <h2>Aduan Masyarakat</h2>

        <p>
            Sampaikan kritik, saran, atau aduan mengenai Desa Serindang.
        </p>

        <form id="aduanForm" class="aduan-form">

            <div class="form-group">
                <label for="nama">Nama</label>

                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama"
                    required>
            </div>


            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    required>
            </div>


            <div class="form-group">
                <label for="kategori">Kategori</label>

                <select
                    id="kategori"
                    name="kategori"
                    required>

                    <option value="">Pilih Kategori</option>
                    <option value="Saran">Saran</option>
                    <option value="Kritik">Kritik</option>
                    <option value="Aduan">Aduan</option>

                </select>
            </div>


            <div class="form-group">
                <label for="judul">Judul Aduan</label>

                <input
                    type="text"
                    id="judul"
                    name="judul"
                    placeholder="Masukkan judul aduan"
                    required>
            </div>


            <div class="form-group">
                <label for="deskripsi">Isi Aduan</label>

                <textarea
                    id="deskripsi"
                    name="deskripsi"
                    rows="6"
                    placeholder="Tuliskan aduan, kritik, atau saran..."
                    required></textarea>
            </div>


            <button
                type="submit"
                class="btn"
                id="btnAduan">

                Kirim Aduan →

            </button>


            <p id="aduanMessage"></p>

        </form>

    </div>

</section>
