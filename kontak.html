<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aduan Desa Serindang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

<header>
    <nav>
        <div class="logo">🌿 Desa Serindang</div>

        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="keindahan.html">Keindahan</a></li>
            <li><a href="potensi.html">Potensi</a></li>
            <li><a href="galeri.html">Galeri</a></li>
            <li><a href="kontak.html" class="active">Aduan</a></li>
        </ul>
    </nav>
</header>

<section class="aduan-section">

    <div class="container">

        <h2>Aduan Masyarakat</h2>

        <p>
            Sampaikan kritik, saran, atau aduan mengenai Desa Serindang.
        </p>

        <form id="aduanForm" class="aduan-form">

            <div class="form-group">
                <label for="nama">Nama</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    required>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>

                <select id="kategori" name="kategori" required>
                    <option value="">Pilih Kategori</option>
                    <option value="Saran">Saran</option>
                    <option value="Kritik">Kritik</option>
                    <option value="Aduan">Aduan</option>
                </select>
            </div>

            <div class="form-group">
                <label for="judul">Judul Aduan</label>

                <input
                    type="text"
                    id="judul"
                    name="judul"
                    placeholder="Masukkan judul aduan"
                    required>
            </div>

            <div class="form-group">
                <label for="deskripsi">Isi Aduan</label>

                <textarea
                    id="deskripsi"
                    name="deskripsi"
                    rows="6"
                    placeholder="Tuliskan aduan, kritik, atau saran..."
                    required></textarea>
            </div>

            <button type="submit" class="btn" id="btnAduan">
                Kirim Aduan →
            </button>

            <p id="aduanMessage"></p>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 Desa Serindang | Website Keindahan Desa</p>
</footer>


<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyxixXPgm970xPYDTOuExKGCa5gfER8zlf8Nu1Wr40A1FdpWocxXQnSdf0PBg-U7V4N/exec";

document.getElementById("aduanForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const tombol = document.getElementById("btnAduan");
    const pesan = document.getElementById("aduanMessage");

    tombol.disabled = true;
    tombol.textContent = "Mengirim...";

    const data = {
        tabel: "Aduan",
        action: "tambah",
        id: Date.now().toString(),
        nama: document.getElementById("nama").value,
        email: document.getElementById("email").value,
        aduan:
            "Kategori: " + document.getElementById("kategori").value +
            " | Judul: " + document.getElementById("judul").value +
            " | Isi: " + document.getElementById("deskripsi").value,
        tanggal: new Date().toLocaleString("id-ID")
    };

    try {

        await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(data)
        });

        pesan.textContent = "Aduan berhasil dikirim!";
        pesan.style.color = "green";

        document.getElementById("aduanForm").reset();

    } catch (error) {

        console.error(error);

        pesan.textContent = "Aduan gagal dikirim!";
        pesan.style.color = "red";

    }

    tombol.disabled = false;
    tombol.textContent = "Kirim Aduan →";

});
</script>

</body>
</html>
